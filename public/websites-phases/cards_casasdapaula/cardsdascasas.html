<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casas da Paula | Alojamento Local Algarve</title>
    <meta name="description" content="Selecção exclusiva de alojamentos para férias no Algarve. Encontre a sua casa ideal e garanta o seu refúgio de sonho.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Base styles & Premium Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0d11;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Layout Grid Container */
        .houses-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .houses-grid {
            display: grid;
            gap: 24px;
            width: 100%;
            grid-template-columns: 1fr; /* Mobile fallback */
        }

        /* Responsive Breakpoints */
        @media (min-width: 600px) {
            .houses-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 columns on tablets/small screens */
            }
        }

        @media (min-width: 1024px) {
            .houses-grid {
                grid-template-columns: repeat(3, 1fr); /* 3 columns on desktop (4 lines/rows total) */
            }
        }

        /* Cards Structure */
        .house-card {
            position: relative;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            background-color: #161920;
            display: block;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .house-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(38, 201, 255, 0.15), 0 0 12px rgba(255, 255, 255, 0.03);
            border-color: rgba(38, 201, 255, 0.3);
        }

        /* Card Gallery Wrapper */
        .card-gallery {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Image styling */
        .gallery-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease-in-out, transform 8s linear;
            filter: brightness(0.85) contrast(1.05);
        }

        .gallery-image.active {
            opacity: 1;
            transform: scale(1.08);
            filter: brightness(0.95) contrast(1.05);
        }

        /* Accommodation Titles */
        .house-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            width: 90%;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 3;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.7);
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        /* Gallery Progress Bar */
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.15);
            z-index: 4;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .house-card:hover .progress-bar,
        .house-card.active .progress-bar {
            opacity: 1;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: #26c9ff;
            box-shadow: 0 0 8px #26c9ff;
        }

        .progress-fill.animating {
            animation: fillProgress 5000ms linear;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* CTA Button */
        .house-btn {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.60rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 12px 26px;
            border: 2px solid #ffffff;
            border-radius: 30px;
            opacity: 0;
            z-index: 3;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: rgba(15, 17, 21, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            overflow: hidden;
            text-transform: uppercase;
        }

        .house-btn span {
            position: relative;
            z-index: 5;
            transition: color 0.4s ease;
        }

        /* Wave Effect on Hover */
        .waves-container {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            transition: bottom 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s ease;
            overflow: hidden;
            opacity: 0;
        }

        .house-btn:hover .waves-container {
            bottom: 0;
            opacity: 1;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background-repeat: repeat-x;
            background-position: 0 bottom;
            transform-origin: center bottom;
        }

        .wave1 {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDEyMCIgcHJlc2VydmVBc3BlY3RSYXRpbz0ibm9uZSI+PHBhdGggZD0iTTAsNjAgQzE1MCwxMDAgMzUwLDIwIDUwMCw2MCBDNjUwLDEwMCA4NTAsMjAgMTAwMCw2MCBDMTE1MCwxMDAgMTMwMCwyMCAxNDAwLDYwIEwxNDAwLDEyMCBMMCwxMjAgWiIgZmlsbD0iIzFkOTdiZiIvPjwvc3ZnPg==');
            background-size: 50% 40px;
            animation: waveMotion 4s linear infinite;
            z-index: 3;
            opacity: 0.35;
        }

        .wave2 {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDEyMCIgcHJlc2VydmVBc3BlY3RSYXRpbz0ibm9uZSI+PHBhdGggZD0iTTAsNTAgQzE1MCw5MCAzNTAsMTAgNTAwLDUwIEM2NTAsOTAgODUwLDEwIDEwMDAsNTAgQzExNTAsOTAgMTMwMCwxMCAxNDAwLDUwIEwxNDAwLDEyMCBMMCwxMjAgWiIgZmlsbD0icmdiYSgzOCwgMjAxLCAyNTUsIDAuNSkiLz48L3N2Zz4=');
            background-size: 50% 45px;
            animation: waveMotion 6s linear infinite reverse;
            z-index: 2;
            opacity: 0.25;
        }

        .wave3 {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDEyMCIgcHJlc2VydmVBc3BlY3RSYXRpbz0ibm9uZSI+PHBhdGggZD0iTTAsNDAgQzE1MCw4MCAzNTAsMCA1MDAsNDAgQzY1MCw4MCA4NTAsMCAxMDAwLDQwIEMxMTUwLDgwIDEzMDAsMCAxNDAwLDQwIEwxNDAwLDEyMCBMMCwxMjAgWiIgZmlsbD0icmdiYSgwLCAxMTQsIDI1NSwgMC4zKSIvPjwvc3ZnPg==');
            background-size: 50% 50px;
            animation: waveMotion 8s linear infinite;
            z-index: 1;
            opacity: 0.15;
        }

        @keyframes waveMotion {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Hover States for Card elements */
        .house-card:hover .house-title,
        .house-card.active .house-title {
            top: 30px;
            font-size: 1.25rem;
            transform: translate(-50%, 0);
        }

        .house-card:hover .house-btn,
        .house-card.active .house-btn {
            top: 55%;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .house-btn:hover {
            border-color: #26c9ff;
            box-shadow: 0 0 20px rgba(38, 201, 255, 0.6);
        }

        /* Responsive Mobile Specific adjustments */
        @media (max-width: 767px) {
            body {
                padding: 20px 15px;
            }
            .house-btn {
                font-size: 0.75rem;
                padding: 10px 20px;
            }
            .house-card:hover .house-title,
            .house-card.active .house-title {
                font-size: 1.1rem;
                top: 25px;
            }
        }
    </style>
</head>
<body>

    <!-- Vanilla Javascript Logic -->
    <script>
        const homeGalleries = {
            beach_house: [
                "Imagens/beach_house.jpg",
                "Imagens/beach_house_um.jpg",
                "Imagens/beach_house_dois.jpg",
                "Imagens/beach_house_tres.jpg"
            ],
            casa_da_areia: [
                "Imagens/casa_da_areia.jpeg",
                "Imagens/casa_da_areia_um.jpeg",
                "Imagens/casa_da_areia_dois.jpeg",
                "Imagens/casa_da_areia_tres.jpeg"
            ],
            gilao: [
                "Imagens/gilao.jpg",
                "Imagens/gilao_um.jpg",
                "Imagens/gilao_dois.jpg",
                "Imagens/gilao_tres.jpg"
            ],
            martinho: [
                "Imagens/martinho.jpg",
                "Imagens/martinho_um.jpg",
                "Imagens/martinho_dois.jpg",
                "Imagens/martinho_tres.jpg"
            ],
            oceano: [
                "Imagens/oceano.jpg",
                "Imagens/oceano_um.jpg",
                "Imagens/oceano_dois.jpg",
                "Imagens/oceano_tres.jpg"
            ],
            sao_vicente: [
                "Imagens/sao_vicente.jpg",
                "Imagens/sao_vicente_um.jpg",
                "Imagens/sao_vicente_dois.jpg",
                "Imagens/sao_vicente_tres.jpg"
            ],
            vitamin_sea: [
                "Imagens/vitamin_sea.jpg",
                "Imagens/vitamin_sea_um.jpg",
                "Imagens/vitamin_sea_dois.jpg",
                "Imagens/vitamin_sea_tres.jpg"
            ],
            baleeira: [
                "Imagens/baleeira.png",
                "Imagens/baleeira_um.png",
                "Imagens/baleeira_dois.png",
                "Imagens/baleeira_tres.png"
            ],
            flor_de_lis: [
                "Imagens/flor-de-lis.jpeg",
                "Imagens/flor-de-lis_um.png",
                "Imagens/flor-de-lis_dois.jpeg",
                "Imagens/flor-de-lis_tres.png"
            ],
            bentley: [
                "Imagens/bentley.jpeg",
                "Imagens/bentley_um.jpeg",
                "Imagens/bentley_dois.jpeg",
                "Imagens/bentley_tres.jpeg"
            ]
        };

        document.addEventListener('DOMContentLoaded', () => {
            const gridItems = document.querySelectorAll('.house-card');

            gridItems.forEach(item => {
                const homeId = item.getAttribute('data-id');
                const images = homeGalleries[homeId];
                if (!images) return;

                const wrapper = item.querySelector('.card-gallery');
                const progressFill = item.querySelector('.progress-fill');

                // Build secondary gallery images
                for (let i = 1; i < images.length; i++) {
                    const img = document.createElement('img');
                    img.className = 'gallery-image';
                    img.src = images[i];
                    img.alt = `${homeId} gallery image ${i + 1}`;
                    wrapper.appendChild(img);
                }

                let intervalId = null;
                let currentIndex = 0;
                const allImgs = Array.from(wrapper.querySelectorAll('.gallery-image'));

                if (allImgs.length < 2) return;

                function triggerProgressAnimation() {
                    progressFill.classList.remove('animating');
                    void progressFill.offsetWidth; // Force Reflow
                    progressFill.classList.add('animating');
                }

                function showNextImage() {
                    allImgs[currentIndex].classList.remove('active');
                    currentIndex = (currentIndex + 1) % allImgs.length;
                    allImgs[currentIndex].classList.add('active');
                    triggerProgressAnimation();
                }

                function startSlideshow() {
                    if (allImgs.length < 2) return;
                    item.classList.add('active');
                    triggerProgressAnimation();
                    if (intervalId) clearInterval(intervalId);
                    intervalId = setInterval(showNextImage, 5000);
                }

                function stopSlideshow() {
                    item.classList.remove('active');
                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                    progressFill.classList.remove('animating');
                    allImgs[currentIndex].classList.remove('active');
                    currentIndex = 0;
                    allImgs[0].classList.add('active');
                }

                // Desktop events
                item.addEventListener('pointerenter', startSlideshow);
                item.addEventListener('pointerleave', stopSlideshow);

                // Mobile touch interaction
                item.addEventListener('click', function(e) {
                    if (window.innerWidth <= 768) {
                        if (!this.classList.contains('active')) {
                            e.preventDefault();
                            gridItems.forEach(otherItem => {
                                if (otherItem !== item && otherItem.stopSlideshow) {
                                    otherItem.stopSlideshow();
                                }
                            });
                            this.classList.add('active');
                            startSlideshow();
                            e.stopPropagation();
                        }
                    }
                });

                // Attach functions so they can be triggered from outside
                item.startSlideshow = startSlideshow;
                item.stopSlideshow = stopSlideshow;
            });

            // Tap anywhere else on screen resets active sliders on mobile
            document.addEventListener('click', () => {
                gridItems.forEach(item => {
                    if (item.stopSlideshow) {
                        item.stopSlideshow();
                    }
                });
            });
        });
    </script>
