<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

 <style>
        body {
        background-color: #000000;
        }
        
        h1 {
            font-family: 'Montserrat';
            font-size: 52px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.4x;
            margin: 0;
            
            /* Smooth color-wave gradient */
            background: linear-gradient(
                90deg,
                #ffffff 0%,
                #ffffff 25%,
                #26c9ff 50%,
                #ffffff 75%,
                #ffffff 100%
            );
            background-size: 200% auto;
            
            /* Clip to text outlines */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Continuous color flow animation */
            animation: textFlowShimmer 6s linear infinite;
        }

        /* Shift gradient position infinitely */
        @keyframes textFlowShimmer {
            0% {
                background-position: 200% center;
            }
            100% {
                background-position: -200% center;
            }
        }
</style>

<body>
    <h1>Alojamentos Casas da Paula</h1>
</body>
</html>
